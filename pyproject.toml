[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "h5handoff"
version = "1.0.0"
description = "Byte-preserving, verifiable handoffs for completed local HDF5 datasets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "h5handoff contributors"}]
dependencies = ["h5py>=3.11,<4"]
keywords = ["hdf5", "beamline", "reproducibility", "data-transfer"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/waxwingfactor/h5handoff"
Issues = "https://github.com/waxwingfactor/h5handoff/issues"
Documentation = "https://github.com/waxwingfactor/h5handoff#readme"

[project.scripts]
h5handoff = "h5handoff.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2", "twine>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
