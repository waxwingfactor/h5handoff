name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python -m build
      - run: twine check dist/*
      - name: Install built wheel into clean environment
        shell: bash
        run: |
          python -m venv wheel-env
          if [ -f wheel-env/Scripts/python.exe ]; then
            py=wheel-env/Scripts/python.exe
          else
            py=wheel-env/bin/python
          fi
          "$py" -m pip install dist/*.whl
          "$py" -m h5handoff --version
          "$py" -m h5handoff demo wheel-demo
          "$py" -m h5handoff pack run/master.h5 --root wheel-demo --output wheel-bundle
          "$py" -m h5handoff verify wheel-bundle
  quality:
    name: quality
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require every test and distribution check
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
